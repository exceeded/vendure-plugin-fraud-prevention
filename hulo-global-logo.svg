<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HULO Global">
  <title>HULO Global</title>
  <!-- HULO frame: rounded navy square. The HG monogram sits inline —
       both letters share the cap height (y17.5) and baseline (y46.5)
       so the mark reads as a word, not a stack. Tuned to stay legible
       at 20px favicon size. -->
  <rect width="64" height="64" rx="14" fill="#0f1419"/>
  <!-- H — slab strokes, 5px bars. -->
  <path d="M7.5 17.5 h5 v12 h8 v-12 h5 v29 h-5 v-12.5 h-8 v12.5 h-5 z" fill="#ffffff"/>
  <!-- G — full-height bowl with the classic inward bar. -->
  <path d="M50.5 22 A12.25 12.25 0 1 0 50.5 42 L50.5 33.1 L43.9 33.1 L43.9 28.7"
        fill="none" stroke="#ffffff" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Amber accent dot — the brand pigment anchor at the G's opening. -->
  <circle cx="50.5" cy="32" r="2.6" fill="#f59e0b"/>
</svg>
